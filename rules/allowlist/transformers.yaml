framework: transformers
description: "Разрешённые глобалы для моделей HuggingFace transformers / tokenizers / accelerate"
version: "1.1"
trusted_prefixes:
  - "transformers."
  - "torch."
  - "tokenizers."
  - "sentence_transformers."
  - "peft."
  - "accelerate."
  - "numpy."
empirical_note: >
  Базовый набор для покрытия моделей HuggingFace transformers — самой
  массовой ML-экосистемы. Включает классы из transformers.models.*
  (наиболее популярные семейства: BERT, GPT-2, GPT-Neo, LLaMA, Mistral,
  Falcon, Qwen, T5, BART, RoBERTa, DistilBERT, ALBERT, XLNet, DeBERTa,
  Whisper, CLIP, ViT). Также покрыты tokenizers, accelerate, peft.

  Аудит #28: до этого файла rules/allowlist/ содержал только pytorch,
  sklearn, numpy. Любая HuggingFace-модель давала кучу false positive
  по AllowlistDetector — `transformers.models.bert.modeling_bert.BertModel`
  не в allowlist → MEDIUM Issue. Это ломало UX для основной аудитории
  (ML-инженеров и пентестеров, проверяющих модели с HuggingFace).

  Источники для калибровки: топ-50 моделей HF Hub по downloads (апрель 2026)
  + русскоязычные fine-tunes (Saiga, Vikhr, ai-forever/ru* семейство).

