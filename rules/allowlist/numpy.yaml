framework: numpy
description: "Разрешённые глобалы для чистых NumPy файлов (.npy, .npz)"
version: "1.2"
trusted_prefixes:
  - "numpy."
globals:
  # --- numpy.core.multiarray (NumPy < 2.0, основа сериализации ndarray) ---
  - module: "numpy.core.multiarray"
    name: "_reconstruct"
    reason: "Внутренняя функция восстановления ndarray при pickle/unpickle"
  - module: "numpy.core.multiarray"
    name: "scalar"
    reason: "NumPy scalar — базовый тип при десериализации скаляров"
  - module: "numpy.core.multiarray"
    name: "where"
    reason: "Условный выбор элементов"
  - module: "numpy.core.multiarray"
    name: "concatenate"
    reason: "Конкатенация массивов"

  # --- numpy._core.multiarray (NumPy >= 2.0 — модуль переименован) ---
  - module: "numpy._core.multiarray"
    name: "_reconstruct"
    reason: "NumPy 2.x: путь к _reconstruct переименован с numpy.core → numpy._core"
  - module: "numpy._core.multiarray"
    name: "scalar"
    reason: "NumPy 2.x: scalar через новый путь"
  - module: "numpy._core.multiarray"
    name: "where"
    reason: "NumPy 2.x: where через новый путь"
  - module: "numpy._core.multiarray"
    name: "concatenate"
    reason: "NumPy 2.x: concatenate через новый путь"

  # --- numpy (основные типы) ---
  - module: "numpy"
    name: "ndarray"
    reason: "Базовый N-мерный массив NumPy"
  - module: "numpy"
    name: "dtype"
    reason: "Тип данных массива"
  - module: "numpy"
    name: "bool_"
    reason: "NumPy boolean dtype"
  - module: "numpy"
    name: "int8"
    reason: "8-битный знаковый integer"
  - module: "numpy"
    name: "int16"
    reason: "16-битный знаковый integer"
  - module: "numpy"
    name: "int32"
    reason: "32-битный знаковый integer"
  - module: "numpy"
    name: "int64"
    reason: "64-битный знаковый integer"
  - module: "numpy"
    name: "uint8"
    reason: "8-битный беззнаковый integer"
  - module: "numpy"
    name: "uint16"
    reason: "16-битный беззнаковый integer"
  - module: "numpy"
    name: "uint32"
    reason: "32-битный беззнаковый integer"
  - module: "numpy"
    name: "uint64"
    reason: "64-битный беззнаковый integer"
  - module: "numpy"
    name: "float16"
    reason: "16-битный float (half precision)"
  - module: "numpy"
    name: "float32"
    reason: "32-битный float (single precision)"
  - module: "numpy"
    name: "float64"
    reason: "64-битный float (double precision)"
  - module: "numpy"
    name: "float128"
    reason: "128-битный float (quad precision, platform-specific)"
  - module: "numpy"
    name: "complex64"
    reason: "Комплексный 64-битный"
  - module: "numpy"
    name: "complex128"
    reason: "Комплексный 128-битный"
  - module: "numpy"
    name: "str_"
    reason: "NumPy строковый dtype"
  - module: "numpy"
    name: "bytes_"
    reason: "NumPy bytes dtype"
  - module: "numpy"
    name: "object_"
    reason: "NumPy object dtype (Python-объекты)"
  - module: "numpy"
    name: "void"
    reason: "NumPy структурированный dtype"

  # --- numpy legacy aliases ---
  - module: "numpy"
    name: "float_"
    reason: "Псевдоним float64"
  - module: "numpy"
    name: "int_"
    reason: "Псевдоним int64/int32 (platform-specific)"
  - module: "numpy"
    name: "complex_"
    reason: "Псевдоним complex128"

  # --- numpy.core ---
  - module: "numpy.core"
    name: "ndarray"
    reason: "Псевдоним через numpy.core"
  - module: "numpy.core"
    name: "dtype"
    reason: "Псевдоним dtype через numpy.core"

  # --- numpy.lib.npyio (чтение/запись .npy/.npz) ---
  - module: "numpy.lib.npyio"
    name: "NpzFile"
    reason: "Объект для работы с .npz архивами"

  # --- collections (появляется в structured arrays) ---
  - module: "collections"
    name: "OrderedDict"
    reason: "Упорядоченный словарь — используется в structured numpy arrays"

  # --- _codecs ---
  - module: "_codecs"
    name: "encode"
    reason: "Стандартная кодировка байт при pickle"
