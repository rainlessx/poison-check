# ML Supply Chain Security — CVE и паттерны угроз
# Формат: id, title, title_ru, description_ru, affected_globals,
#          trigger_opcodes, severity, confidence, references, remediation_ru
# Обновляется независимо от кода.

- id: "CVE-2025-32434"
  title: "PyTorch legacy pickle format: potential RCE on torch.load (CVE-2025-32434)"
  title_ru: "Pickle-формат PyTorch: потенциальный RCE при загрузке через torch.load"
  description_en: >-
    The file uses the legacy PyTorch pickle format. CVE-2025-32434: torch.load() without
    weights_only=True executes arbitrary code during deserialization. This is an
    informational note about the file format — the mere presence of torch._utils does not by
    itself mean the model is malicious. Actual attacks are reported by dedicated detectors
    (os.system, subprocess, eval, etc.).
  remediation_en: >-
    Load the model with torch.load(..., weights_only=True) or convert it to safetensors.
    Upgrade PyTorch to 2.6.0 or later.
  description_ru: >-
    Файл сохранён в формате pickle (legacy PyTorch). CVE-2025-32434: torch.load()
    без параметра weights_only=True выполняет произвольный код при десериализации.
    Это информационное предупреждение о формате файла — само по себе наличие
    torch._utils не означает вредоносности модели. Реальные атаки обнаруживаются
    отдельными детекторами (os.system, subprocess, eval и т.д.).
  affected_globals:
    - module: "torch"
      name: "_utils"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "info"
  confidence: "low"
  references:
    - type: "cve"
      id: "CVE-2025-32434"
    - type: "cwe"
      id: "CWE-502"
  remediation_ru: >-
    При загрузке модели используйте torch.load(..., weights_only=True) или
    переведите модель в формат safetensors. Обновите PyTorch до версии 2.6.0+.

- id: "PATTERN-OS-SYSTEM"
  title: "os.system/os.popen call detected in pickle stream"
  title_ru: "Обнаружен вызов os.system/os.popen в потоке pickle"
  description_en: >-
    The pickle stream contains a call to os.system or os.popen, which allows executing
    arbitrary operating-system commands when the file is loaded. This is a classic RCE
    (Remote Code Execution) vector through ML files, observed in real malicious models on
    HuggingFace (ReversingLabs report, 2023).
  remediation_en: >-
    Do not load this file. Ask the source for a safetensors or ONNX file. Verify the model's
    origin for signs of compromise.
  description_ru: >-
    Pickle-файл содержит вызов os.system или os.popen, что позволяет выполнять
    произвольные команды операционной системы при загрузке файла. Это классический
    вектор атаки RCE (Remote Code Execution) через ML-файлы. Обнаружен в реальных
    вредоносных моделях на HuggingFace (отчёт ReversingLabs, 2023).
  affected_globals:
    - module: "os"
      name: "system"
    - module: "posix"
      name: "system"
    - module: "os"
      name: "popen"
    - module: "posix"
      name: "popen"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "critical"
  confidence: "certain"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-78"
  remediation_ru: >-
    Не загружайте этот файл. Запросите у источника файл в формате safetensors
    или ONNX. Проверьте источник загрузки модели на предмет компрометации.

- id: "PATTERN-SUBPROCESS"
  title: "subprocess (Popen/call/run) call detected in pickle stream"
  title_ru: "Обнаружен вызов subprocess (Popen/call/run) в потоке pickle"
  description_en: >-
    The pickle stream contains calls to the subprocess module (Popen, call, run,
    check_output), which allows spawning arbitrary processes when the file is loaded. This
    is equivalent to full RCE — an attacker can run any program under the identity of the
    process loading the model.
  remediation_en: >-
    Do not load this file. ML models must not reference subprocess. Switch to safetensors
    for storing neural-network weights.
  description_ru: >-
    Pickle-файл содержит вызовы модуля subprocess (Popen, call, run, check_output),
    что позволяет запускать произвольные процессы при загрузке файла. Эквивалентно
    полноценному RCE — атакующий может запустить любую программу от имени процесса,
    загружающего модель.
  affected_globals:
    - module: "subprocess"
      name: "Popen"
    - module: "subprocess"
      name: "call"
    - module: "subprocess"
      name: "run"
    - module: "subprocess"
      name: "check_output"
    - module: "subprocess"
      name: "check_call"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "critical"
  confidence: "certain"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-78"
  remediation_ru: >-
    Не загружайте этот файл. ML-модели не должны содержать ссылки на subprocess.
    Переключитесь на safetensors для хранения весов нейронных сетей.

- id: "PATTERN-BUILTINS-EVAL"
  title: "builtins.eval call detected in pickle stream"
  title_ru: "Обнаружен вызов builtins.eval в потоке pickle"
  description_en: >-
    The pickle stream contains a call to builtins.eval — a function that executes arbitrary
    Python code from a string. An attacker supplies any Python code to run when the model
    loads. eval in an ML file is a clear sign of malicious intent — legitimate models do not
    use eval during deserialization.
  remediation_en: >-
    The file is clearly malicious. Do not load it. Report the RCE attempt via an ML file to
    your information-security team.
  description_ru: >-
    Pickle-файл содержит вызов builtins.eval — функции, выполняющей произвольный
    Python-код из строки. Атакующий передаёт любой Python-код для исполнения при
    загрузке модели. Функция eval в ML-файле является явным признаком вредоносного
    умысла — легитимные модели не используют eval при десериализации.
  affected_globals:
    - module: "builtins"
      name: "eval"
    - module: "__builtin__"
      name: "eval"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "critical"
  confidence: "certain"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-95"
  remediation_ru: >-
    Файл явно вредоносен. Не загружайте его. Сообщите в службу информационной
    безопасности о попытке RCE-атаки через ML-файл.

- id: "PATTERN-BUILTINS-EXEC"
  title: "builtins.exec call detected in pickle stream"
  title_ru: "Обнаружен вызов builtins.exec в потоке pickle"
  description_en: >-
    The pickle stream contains a call to builtins.exec — a function that executes arbitrary
    Python code. Unlike eval, exec can run multi-line code and define functions and classes.
    It is used in advanced pickle attacks to deploy a full backdoor when the model loads.
  remediation_en: >-
    The file is clearly malicious. Do not load it. Isolate the file, perform forensic
    analysis, and report it to your information-security team.
  description_ru: >-
    Pickle-файл содержит вызов builtins.exec — функции, выполняющей произвольный
    Python-код. В отличие от eval, exec позволяет выполнять многострочный код,
    определять функции и классы. Используется в продвинутых pickle-атаках для
    развёртывания полноценного backdoor при загрузке модели.
  affected_globals:
    - module: "builtins"
      name: "exec"
    - module: "__builtin__"
      name: "exec"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "critical"
  confidence: "certain"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-95"
  remediation_ru: >-
    Файл явно вредоносен. Не загружайте его. Изолируйте файл и проведите
    forensics-анализ. Сообщите в службу информационной безопасности.

- id: "PATTERN-DILL-BYPASS"
  title: "dill code-object reconstruction detected (weights_only=True bypass)"
  title_ru: "Обход weights_only=True через восстановление code-объекта из dill"
  description_en: >-
    dill._dill._create_code can build Python code objects from serialized data — a known
    technique for bypassing torch.load(..., weights_only=True). After reconstructing a code
    object, the attacker runs it via exec or eval, achieving full RCE even with weights_only
    enabled. Exploitable in PyTorch prior to the 2026 patch.
  remediation_en: >-
    Upgrade PyTorch to the latest version and do not use dill to serialize ML models.
    Convert the model to safetensors. Add PATTERN-DILL-BYPASS to your CI/CD blocklist.
  description_ru: >-
    dill._dill._create_code позволяет создавать Python code-объекты из сериализованных
    данных, что является известным методом обхода защиты torch.load(..., weights_only=True).
    После создания code-объекта атакующий выполняет его через exec или eval, получая
    полноценный RCE даже при включённом режиме weights_only. Эксплуатируется в PyTorch
    до патча 2026 года.
  affected_globals:
    - module: "dill._dill"
      name: "_create_code"
    - module: "dill._dill"
      name: "_create_function"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "critical"
  confidence: "certain"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-693"
  remediation_ru: >-
    Обновите PyTorch до последней версии и не используйте dill для сериализации
    ML-моделей. Переведите модель на safetensors. Добавьте PATTERN-DILL-BYPASS
    в список блокировок вашего CI/CD пайплайна.

- id: "GHSA-83PF-V6QQ-PWMR"
  title: "fickling lazy AST scanner bypass via ftplib/smtplib __init__ execution"
  title_ru: "Обход lazy AST сканера fickling через код в __init__ ftplib/smtplib"
  description_en: >-
    GHSA-83pf-v6qq-pwmr (February 2026): an attacker bypasses fickling's lazy AST analyzer
    using ftplib.FTP or smtplib.SMTP, whose __init__ methods open network connections on
    object initialization. A pickle REDUCE + ftplib.FTP invokes FTP.__init__ with attacker-
    controlled arguments, evading static-analysis heuristics. These globals must never
    appear in an ML model.
  remediation_en: >-
    ftplib and smtplib must not appear in an ML model. Their presence indicates a malicious
    file or a tool bypassing security controls. Do not load the file.
  description_ru: >-
    GHSA-83pf-v6qq-pwmr (февраль 2026): атакующий обходит lazy AST-анализатор
    fickling, используя ftplib.FTP или smtplib.SMTP, методы __init__ которых
    выполняют сетевые соединения при инициализации объекта. Pickle REDUCE + ftplib.FTP
    вызывает FTP.__init__ с аргументами атакующего, обходя эвристики статического
    анализа. В ML-модели эти глобалы не должны присутствовать никогда.
  affected_globals:
    - module: "ftplib"
      name: "FTP"
    - module: "smtplib"
      name: "SMTP"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "high"
  confidence: "high"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-74"
  remediation_ru: >-
    ftplib и smtplib не должны присутствовать в ML-модели. Это признак вредоносного
    файла или инструментального обхода средств защиты. Не загружайте файл.

- id: "PATTERN-NUMPY-FROMPYFUNC"
  title: "numpy.frompyfunc call detected in pickle stream"
  title_ru: "Обнаружен вызов numpy.frompyfunc в потоке pickle"
  description_en: >-
    numpy.frompyfunc serializes an arbitrary Python callable as a numpy ufunc. It is used in
    numpy object-array RCE attacks: the attacker builds a numpy array with object dtype
    containing an object with a malicious __reduce__, then saves it to .npy/.npz. On load,
    numpy deserializes the objects' pickle stream. numpy.frompyfunc in a serialized file is
    atypical of legitimate ML models.
  remediation_en: >-
    numpy.frompyfunc should not appear in serialized ML models. Verify the file's origin.
    Request the model be re-saved as safetensors, or as .npy with a dtype that excludes
    arbitrary Python objects.
  description_ru: >-
    numpy.frompyfunc сериализует произвольный Python callable как numpy ufunc.
    Используется в атаках через numpy object array RCE: злоумышленник создаёт
    numpy-массив с object dtype, содержащий объект с вредоносным __reduce__,
    сохраняет в .npy/.npz. При загрузке numpy десериализует pickle-поток объектов.
    numpy.frompyfunc в сериализованном файле нетипичен для легитимных ML-моделей.
  affected_globals:
    - module: "numpy"
      name: "frompyfunc"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "high"
  confidence: "medium"
  references:
    - type: "cwe"
      id: "CWE-502"
  remediation_ru: >-
    numpy.frompyfunc не должен встречаться в сериализованных ML-моделях. Проверьте
    источник файла. Запросите пересохранение модели в формате safetensors или npy
    с dtype, исключающим произвольные Python-объекты.

- id: "PATTERN-CLOUDPICKLE-FUNCTION"
  title: "cloudpickle function-reconstruction gadget detected in joblib"
  title_ru: "Десериализация произвольной Python-функции через cloudpickle в joblib"
  description_en: >-
    cloudpickle._make_skel_func and _make_function reconstruct arbitrary Python functions
    from bytecode. joblib uses them to serialize closures and lambdas, but they can equally
    execute arbitrary code when a joblib file from an untrusted source is loaded. The
    presence of cloudpickle means the model contains executable Python code, not just
    weights.
  remediation_en: >-
    Do not load joblib files carrying arbitrary Python functions from untrusted sources. Use
    safetensors or ONNX for ML models. If functions must be shipped, use safe formats (ONNX
    custom ops).
  description_ru: >-
    cloudpickle._make_skel_func и _make_function воссоздают произвольные Python-функции
    из байт-кода. Эти функции используются joblib при сериализации closures и лямбд,
    но также могут применяться для выполнения произвольного кода при загрузке
    joblib-файла из ненадёжного источника. Наличие cloudpickle в ML-модели означает,
    что модель содержит исполняемый Python-код, а не только веса.
  affected_globals:
    - module: "cloudpickle.cloudpickle"
      name: "_make_skel_func"
    - module: "cloudpickle.cloudpickle"
      name: "_make_function"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "high"
  confidence: "medium"
  references:
    - type: "cwe"
      id: "CWE-502"
  remediation_ru: >-
    Не загружайте joblib-файлы с произвольными Python-функциями из ненадёжных
    источников. Используйте safetensors или ONNX для хранения ML-моделей.
    При необходимости передавать функции используйте безопасные форматы (ONNX custom ops).

- id: "PATTERN-CTYPES-EXEC"
  title: "ctypes shared-library load detected in pickle stream"
  title_ru: "Загрузка разделяемой библиотеки через ctypes (паттерн STACK_GLOBAL + REDUCE)"
  description_en: >-
    ctypes.CDLL loads an arbitrary shared library (.so/.dll) and executes machine code.
    Inside a pickle file this allows running shellcode or loading a malicious library when
    the ML model loads. The pattern uses STACK_GLOBAL + REDUCE to invoke ctypes dynamically;
    it has no assigned CVE id but is critically dangerous.
  remediation_en: >-
    ctypes in an ML model is a clear sign of malicious code. Do not load the file. Isolate
    it, perform forensic analysis, and report it to your information-security team.
  description_ru: >-
    ctypes.CDLL загружает произвольную разделяемую библиотеку (.so/.dll) и выполняет
    машинный код. В контексте pickle-файла это позволяет выполнить shellcode или
    загрузить вредоносную библиотеку при загрузке ML-модели. Паттерн использует
    STACK_GLOBAL + REDUCE для динамического вызова ctypes без известного CVE-идентификатора,
    но с критической степенью опасности.
  affected_globals:
    - module: "ctypes"
      name: "CDLL"
    - module: "ctypes"
      name: "cdll"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "critical"
  confidence: "high"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-114"
  remediation_ru: >-
    ctypes в ML-модели является явным признаком вредоносного кода. Не загружайте
    файл. Изолируйте его, проведите forensics-анализ и сообщите в службу
    информационной безопасности.

- id: "PATTERN-BUILTINS-INDIRECT-IMPORT"
  title: "builtins.__import__ + getattr chain detected in pickle stream"
  title_ru: "Обнаружена цепочка builtins.__import__ + getattr в потоке pickle"
  description_en: >-
    The pickle stream contains builtins.__import__ or builtins.getattr — key components of
    an indirect RCE chain: __import__('os') -> getattr(os_mod, 'system') -> system('cmd').
    This technique evades naive detectors that only check for direct os.system calls. Real
    attacks use it to bypass protections such as weights_only=True and shallow scanners.
  remediation_en: >-
    ML models must not contain dynamic imports or reflection via builtins. Convert the model
    to safetensors or ONNX. Verify the model's origin.
  description_ru: >-
    Pickle-файл содержит вызов builtins.__import__ или builtins.getattr — ключевых
    компонентов indirect RCE-цепочки: __import__('os') → getattr(os_mod, 'system') →
    system('cmd'). Эта техника обходит наивные детекторы, проверяющие только прямые
    вызовы os.system. В реальных атаках используется для обхода защит типа
    weights_only=True и поверхностных сканеров.
  affected_globals:
    - module: "builtins"
      name: "__import__"
    - module: "builtins"
      name: "getattr"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "high"
  confidence: "high"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-470"
  remediation_ru: >-
    ML-модели не должны содержать динамический импорт или рефлексию через builtins.
    Переведите модель на safetensors или ONNX. Проверьте источник модели.

