# Gadget-модули по публичным инцидентам и отчётам 2024–2025 (ReversingLabs, HuggingFace).
# Все они — «косвенные» гаджеты: сам глобал не выглядит как os.system, но при
# вызове через REDUCE приводит к выполнению кода или загрузке внешнего payload.
# ---------------------------------------------------------------------------

- id: "PATTERN-PANDAS-READ-PICKLE"
  title: "pandas.read_pickle gadget detected (nested pickle load)"
  title_ru: "Вложенная десериализация pickle через гаджет pandas.read_pickle"
  description_en: >-
    pandas.read_pickle loads and deserializes a pickle from a file or URL — equivalent to
    pickle.load() and leading to arbitrary code execution (RCE). It is used as an allowlist-
    bypass gadget: pandas itself may be trusted, but read_pickle can pull in a second,
    malicious pickle from an arbitrary source (including over the network). Observed in
    2024-2025 incidents with HuggingFace models. Legitimate models do not serialize a
    read_pickle call — its presence indicates a hidden payload load.
  remediation_en: >-
    Do not load this file. pandas.read_pickle inside a serialized model is a sign of a
    nested pickle attack. Request the model as safetensors and check the source for
    compromise.
  description_ru: >-
    pandas.read_pickle загружает и десериализует pickle из файла или URL, что
    эквивалентно вызову pickle.load() и приводит к выполнению произвольного кода
    (RCE). Применяется как гаджет обхода allowlist: сам pandas может быть в списке
    доверенных, но read_pickle позволяет подтянуть второй, вредоносный pickle из
    произвольного источника (в том числе по сети). Наблюдалось в инцидентах
    2024–2025 с моделями на HuggingFace. Легитимные модели не сериализуют вызов
    read_pickle — его наличие говорит о попытке скрытой загрузки payload.
  affected_globals:
    - module: "pandas"
      name: "read_pickle"
    - module: "pandas.io.pickle"
      name: "read_pickle"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "high"
  confidence: "high"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-94"
  remediation_ru: >-
    Не загружайте этот файл. pandas.read_pickle внутри сериализованной модели —
    признак вложенной pickle-атаки. Запросите модель в формате safetensors и
    проверьте источник на предмет компрометации.

- id: "PATTERN-BDB-PDB-RUN"
  title: "bdb/pdb debugger (Bdb.run) gadget detected in pickle stream"
  title_ru: "Обнаружен вызов отладчика bdb/pdb (Bdb.run) в потоке pickle"
  description_en: >-
    bdb.Bdb.run and pdb.Pdb.run (as well as run/runeval/runcall) take a string or code
    object and execute it via exec() inside the debugger. In pickle this is a full RCE
    gadget: a REDUCE invokes Bdb.run('malicious code'). bdb and pdb are part of the standard
    library, so the attack needs no third-party dependencies and evades detectors looking
    only for os.system/eval/exec. These globals must never appear in an ML model.
  remediation_en: >-
    The file is malicious: bdb/pdb debugging functions in a serialized model serve only to
    execute code. Do not load the file; isolate it and report it to your information-
    security team.
  description_ru: >-
    Методы bdb.Bdb.run и pdb.Pdb.run (а также run/runeval/runcall) принимают строку
    или code-объект и исполняют её через exec() внутри отладчика. В pickle это
    полноценный гаджет RCE: REDUCE вызывает Bdb.run('вредоносный код'). Модули bdb и
    pdb входят в стандартную библиотеку, поэтому атака не требует сторонних
    зависимостей и обходит детекторы, ищущие только os.system/eval/exec. В
    ML-модели этих глобалов не должно быть никогда.
  affected_globals:
    - module: "bdb"
      name: "Bdb.run"
    - module: "bdb"
      name: "Bdb.runeval"
    - module: "bdb"
      name: "Bdb.runcall"
    - module: "pdb"
      name: "Pdb.run"
    - module: "pdb"
      name: "run"
    - module: "pdb"
      name: "runeval"
    - module: "pdb"
      name: "runcall"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "high"
  confidence: "high"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-94"
  remediation_ru: >-
    Файл вредоносен: отладочные функции bdb/pdb в сериализованной модели служат
    только для исполнения кода. Не загружайте файл, изолируйте его и сообщите в
    службу информационной безопасности.

- id: "PATTERN-ASTEVAL-INTERP"
  title: "asteval.Interpreter call detected in pickle stream"
  title_ru: "Обнаружен вызов asteval.Interpreter в потоке pickle"
  description_en: >-
    asteval is an expression-evaluation library; the asteval.Interpreter object executes
    supplied Python code when called. Although asteval markets itself as a 'safe' eval,
    sandbox escapes are known (access to __class__/__subclasses__). The presence of
    Interpreter in a serialized model indicates an attempt to execute arbitrary code during
    deserialization.
  remediation_en: >-
    asteval.Interpreter should not appear in a serialized ML model. Verify the file's origin
    and request the model be re-saved as safetensors.
  description_ru: >-
    asteval — библиотека вычисления выражений; объект asteval.Interpreter при вызове
    исполняет переданный Python-код. Хотя asteval позиционируется как «безопасный»
    eval, для него известны обходы песочницы (доступ к __class__/__subclasses__).
    Наличие Interpreter в сериализованной модели — признак попытки выполнения
    произвольного кода при десериализации.
  affected_globals:
    - module: "asteval"
      name: "Interpreter"
    - module: "asteval.asteval"
      name: "Interpreter"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "high"
  confidence: "medium"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-95"
  remediation_ru: >-
    asteval.Interpreter не должен встречаться в сериализованной ML-модели. Проверьте
    источник файла и запросите пересохранение модели в формате safetensors.

- id: "PATTERN-RUNPY-EXEC"
  title: "runpy (_run_code/_run_module_code) gadget detected in pickle stream"
  title_ru: "Обнаружен вызов runpy (_run_code/_run_module_code) в потоке pickle"
  description_en: >-
    runpy._run_code and runpy._run_module_code execute a module's code in a given namespace
    (equivalent to exec), while runpy.run_path/run_module run an arbitrary .py file or
    module. In pickle this is an RCE gadget that bypasses naive detectors of direct
    os.system/eval calls. The runpy module is part of the standard library — the attack
    needs no third-party dependencies.
  remediation_en: >-
    runpy functions in a serialized model serve only to execute code. Do not load the file.
    Convert the model to safetensors or ONNX and verify the source.
  description_ru: >-
    runpy._run_code и runpy._run_module_code исполняют код модуля в заданном
    пространстве имён (эквивалент exec), а runpy.run_path/run_module запускают
    произвольный .py-файл или модуль. В pickle это гаджет RCE, обходящий наивные
    детекторы прямых вызовов os.system/eval. Модуль runpy входит в стандартную
    библиотеку — атака не требует сторонних зависимостей.
  affected_globals:
    - module: "runpy"
      name: "_run_code"
    - module: "runpy"
      name: "_run_module_code"
    - module: "runpy"
      name: "_run_module_as_main"
    - module: "runpy"
      name: "run_path"
    - module: "runpy"
      name: "run_module"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "high"
  confidence: "high"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-94"
  remediation_ru: >-
    runpy-функции в сериализованной модели служат только для исполнения кода. Не
    загружайте файл. Переведите модель на safetensors или ONNX и проверьте источник.

- id: "PATTERN-TORCH-HUB"
  title: "torch.hub call detected in pickle stream (remote code download)"
  title_ru: "Обнаружено обращение к torch.hub в потоке pickle (загрузка удалённого кода)"
  description_en: >-
    torch.hub.load downloads a GitHub repository and executes its hubconf.py, resulting in
    arbitrary remote code execution. torch.hub.load_state_dict_from_url,
    download_url_to_file, and _load_local fetch files from the network. A serialized model
    must not contain these calls: they are simultaneously an RCE vector and a call to
    external infrastructure (a potential C2 channel), breaking the offline-isolation
    requirement for the banking and government sectors.
  remediation_en: >-
    torch.hub in a serialized model downloads and executes code from the network. Do not
    load the file inside an isolated perimeter. Use safetensors and obtain weights only from
    a trusted offline source.
  description_ru: >-
    torch.hub.load скачивает GitHub-репозиторий и исполняет его hubconf.py, что
    приводит к выполнению произвольного удалённого кода. torch.hub.load_state_dict_from_url,
    download_url_to_file и _load_local загружают файлы из сети. В сериализованной
    модели этих вызовов быть не должно: это одновременно вектор RCE и обращение к
    внешней инфраструктуре (потенциальный C2-канал), нарушающее требование офлайн-
    изоляции для банковского и государственного сектора.
  affected_globals:
    - module: "torch.hub"
      name: "load"
    - module: "torch.hub"
      name: "load_state_dict_from_url"
    - module: "torch.hub"
      name: "download_url_to_file"
    - module: "torch.hub"
      name: "_load_local"
  trigger_opcodes: ["REDUCE", "GLOBAL", "STACK_GLOBAL", "INST", "NEWOBJ", "NEWOBJ_EX"]
  severity: "high"
  confidence: "medium"
  references:
    - type: "cwe"
      id: "CWE-502"
    - type: "cwe"
      id: "CWE-494"
    - type: "cwe"
      id: "CWE-829"
  remediation_ru: >-
    torch.hub в сериализованной модели загружает и исполняет код из сети. Не
    загружайте файл в изолированном периметре. Используйте safetensors и получайте
    веса только из доверенного офлайн-источника.
