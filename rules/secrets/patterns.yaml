# Паттерны для обнаружения секретов и чувствительных данных в ML-файлах.
# Каждый паттерн описывает регулярное выражение (Python re-синтаксис),
# уровень критичности и русское описание.
#
# Поля:
#   name        — уникальный идентификатор паттерна
#   pattern     — регулярное выражение (IGNORECASE применяется к generic-паттернам)
#   severity    — critical | high | medium
#   case_sensitive — true по умолчанию для специфичных паттернов; false для generic
#   description_ru — сообщение для пользователя на русском
#   why_ru      — почему это опасно
#   remediation_ru — что делать

patterns:
  # ─── Конкретные провайдеры ────────────────────────────────────────────────

  - name: "openai_api_key"
    pattern: "sk-[a-zA-Z0-9]{48}"
    severity: critical
    case_sensitive: true
    description_ru: "Обнаружен API ключ OpenAI"
    why_ru: "API ключ OpenAI позволяет выполнять запросы к GPT-моделям за ваш счёт и получать доступ к вашим данным в OpenAI."
    remediation_ru: "Немедленно отзовите ключ на platform.openai.com. Никогда не встраивайте ключи в файлы моделей."

  - name: "openai_org_key"
    pattern: "sk-org-[a-zA-Z0-9]{48}"
    severity: critical
    case_sensitive: true
    description_ru: "Обнаружен ключ организации OpenAI"
    why_ru: "Ключ организации OpenAI предоставляет доступ ко всем ресурсам организации."
    remediation_ru: "Немедленно отзовите ключ на platform.openai.com."

  - name: "huggingface_token"
    pattern: "hf_[a-zA-Z0-9]{37}"
    severity: critical
    case_sensitive: true
    description_ru: "Обнаружен токен HuggingFace"
    why_ru: "Токен HuggingFace позволяет скачивать приватные модели, загружать файлы и управлять репозиториями от вашего имени."
    remediation_ru: "Отзовите токен на huggingface.co/settings/tokens."

  - name: "aws_access_key"
    pattern: "AKIA[0-9A-Z]{16}"
    severity: critical
    case_sensitive: true
    description_ru: "Обнаружен AWS Access Key ID"
    why_ru: "AWS Access Key ID в паре с секретным ключом предоставляет доступ к облачным ресурсам AWS."
    remediation_ru: "Немедленно деактивируйте ключ в AWS IAM Console и проверьте CloudTrail на предмет несанкционированного использования."

  - name: "aws_secret_key"
    pattern: "(?i)aws[_\\-\\s]?secret[_\\-\\s]?(?:access[_\\-\\s]?)?key['\"\\s]*[:=]\\s*['\"]?[a-zA-Z0-9/+]{40}"
    severity: critical
    case_sensitive: false
    description_ru: "Обнаружен AWS Secret Access Key"
    why_ru: "AWS Secret Access Key вместе с Access Key ID предоставляет полный доступ к облачным сервисам AWS."
    remediation_ru: "Немедленно деактивируйте ключ в AWS IAM Console."

  - name: "github_token"
    pattern: "(?:ghp|gho|ghu|ghs|ghr)_[a-zA-Z0-9]{36}"
    severity: critical
    case_sensitive: true
    description_ru: "Обнаружен токен GitHub"
    why_ru: "Токен GitHub позволяет читать приватные репозитории, создавать коммиты и управлять настройками от вашего имени."
    remediation_ru: "Отзовите токен на github.com/settings/tokens."

  - name: "google_api_key"
    pattern: "AIza[0-9A-Za-z\\-_]{35}"
    severity: critical
    case_sensitive: true
    description_ru: "Обнаружен API ключ Google"
    why_ru: "Google API ключ предоставляет доступ к сервисам Google (Maps, Cloud, YouTube и др.) за ваш счёт."
    remediation_ru: "Удалите ключ в Google Cloud Console и создайте новый с ограниченными правами."

  - name: "telegram_bot_token"
    pattern: "[0-9]{8,10}:[a-zA-Z0-9_-]{35}"
    severity: high
    case_sensitive: true
    description_ru: "Возможный токен Telegram-бота"
    why_ru: "Токен Telegram-бота позволяет управлять ботом, читать сообщения пользователей и рассылать спам."
    remediation_ru: "Отзовите токен через @BotFather командой /revoke."

  - name: "slack_token"
    pattern: "xox[baprs]-[0-9a-zA-Z]{10,48}"
    severity: critical
    case_sensitive: true
    description_ru: "Обнаружен токен Slack"
    why_ru: "Токен Slack предоставляет доступ к workspace: чтение сообщений, управление каналами, доступ к файлам."
    remediation_ru: "Отзовите токен в настройках Slack App."

  - name: "slack_webhook"
    pattern: "https://hooks\\.slack\\.com/services/[A-Z0-9]{9,}/[A-Z0-9]{9,}/[a-zA-Z0-9]{24,}"
    severity: high
    case_sensitive: true
    description_ru: "Обнаружен Slack Incoming Webhook URL"
    why_ru: "Slack Webhook позволяет отправлять сообщения в канал Slack без аутентификации."
    remediation_ru: "Удалите и пересоздайте Incoming Webhook в настройках Slack App."

  # ─── Generic паттерны ────────────────────────────────────────────────────

  - name: "generic_api_key"
    pattern: "api[_\\-]?key['\"\\s]*[:=]\\s*['\"]?[a-zA-Z0-9_\\-]{20,}"
    severity: high
    case_sensitive: false
    description_ru: "Возможный API ключ"
    why_ru: "Строка похожа на присвоение значения API-ключу. Если это настоящий ключ, его утечка может привести к несанкционированному доступу к сервису."
    remediation_ru: "Проверьте, является ли это реальным ключом. Если да — вынесите его в переменные окружения."

  - name: "generic_secret"
    pattern: "(?:secret|password|passwd|pwd)['\"\\s]*[:=]\\s*['\"]?[a-zA-Z0-9_\\-!@#$%^&*]{8,}"
    severity: high
    case_sensitive: false
    description_ru: "Возможный пароль или секрет"
    why_ru: "Строка похожа на присвоение значения паролю или секрету."
    remediation_ru: "Проверьте, является ли это реальными учётными данными. Если да — смените пароль."

  - name: "private_key_header"
    pattern: "-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    severity: critical
    case_sensitive: true
    description_ru: "Обнаружен приватный криптографический ключ"
    why_ru: "Приватный ключ позволяет расшифровывать данные, подписывать документы и аутентифицироваться на серверах от вашего имени."
    remediation_ru: "Немедленно отзовите и замените ключевую пару. Проверьте, не был ли ключ использован несанкционированно."

  - name: "jwt_token"
    pattern: "eyJ[a-zA-Z0-9_-]{10,}\\.eyJ[a-zA-Z0-9_-]{10,}\\.[a-zA-Z0-9_-]{10,}"
    severity: medium
    case_sensitive: true
    description_ru: "Обнаружен JWT-токен"
    why_ru: "JWT-токен может содержать данные аутентификации и использоваться для доступа к API."
    remediation_ru: "Проверьте, является ли токен действующим. Если да — убедитесь в необходимости его присутствия в файле модели."

  - name: "database_url"
    pattern: "(?:postgres|postgresql|mysql|mongodb|redis|mssql)(?:\\+[a-z]+)?://[^@\\s]+:[^@\\s]+@[^\\s/]+"
    severity: critical
    case_sensitive: false
    description_ru: "Обнаружены учётные данные базы данных в URL"
    why_ru: "URL с логином и паролем к базе данных позволяет получить прямой доступ к данным."
    remediation_ru: "Замените учётные данные БД и используйте переменные окружения или секреты."
