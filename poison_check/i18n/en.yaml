# Attention threshold (severity_threshold): findings below it are not hidden,
# they are reported in a separate, explicitly marked block.
threshold:
  below_section: "Below attention threshold (severity_threshold: {threshold})"
  below_count: "Below attention threshold ({threshold}): {count}"
  justification: "Below the policy attention threshold (severity_threshold:\
    \ {threshold}): the finding is shown but needs no immediate action"
  gate_note: "The attention threshold only affects report presentation; gate\
    \ failure is governed by fail_on_severity"

# Report header: audit details (CLI options --client / --auditor).
# An unset field is omitted entirely — an empty field is worse than no field.
report:
