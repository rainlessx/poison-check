issues:
  MLS001:
    why: "A blocklist global import was detected. Such classes and functions should\
      \ not appear in serialized ML models — they can execute arbitrary code upon loading."
    remediation: "Do not load this model. Ask the author to re-save it in the safe\
      \ safetensors format. If the source is trusted — review the decompiled code\
      \ and verify the function is harmless."

  MLS010:
    why: "A global import was detected that is not in the allowlist for this ML framework.\
      \ This may be a malicious payload or an unusual dependency."
    remediation: "Review the decompiled code. If the function is safe — add it to\
      \ the allowlist for the corresponding framework (rules/allowlist/). If suspicious\
      \ — do not load the model."

  MLS020:
    why: "A secret (API key, token, password) was found in the model. The model was\
      \ likely saved in an environment with active credentials that accidentally ended\
      \ up in the file."
    remediation: "Immediately revoke the compromised secret in the corresponding\
      \ service. Clean the model and re-save. Do not publish the compromised model."

  MLS030:
    why: "A URL to a potentially dangerous domain was found in the model. This may\
      \ be a C2 (Command & Control) indicator triggered when the model is loaded."
    remediation: "Verify the URL manually. If the domain is unknown — do not load\
      \ the model. Report to your security team."

  MLS031:
    why: "A URL to an unknown external domain was found in the model. Loading the\
      \ model may trigger a connection to this URL, violating offline requirements\
      \ and potentially causing data exfiltration."
    remediation: "Verify what this URL is used for. If the model should work offline\
      \ — this is unacceptable. Ask the author to remove external dependencies."

  MLS032:
    why: "A URL to a local or private IP address was found in the model. This may\
      \ indicate an SSRF (Server-Side Request Forgery) attempt or attack on internal\
      \ infrastructure when the model is loaded."
    remediation: "Investigate the purpose of this address. If not needed for model\
      \ operation — this is suspicious. Do not deploy this model in production."

  MLS033:
    why: "A URL to a public IP address was found in the model. Direct IP addresses\
      \ in models are atypical and may indicate an attempt to establish a covert\
      \ connection."
    remediation: "Check if this is a C2 address. Use reputation services (VirusTotal,\
      \ AbuseIPDB). If the address is suspicious — do not load the model."

  MLS034:
    why: "A public IP address was found in the model's string data. This may indicate\
      \ an attempt to establish a covert network connection when the model code executes."
    remediation: "Check the IP address reputation. If the model should not connect\
      \ to external addresses — this is suspicious. Contact your security team."

  MLS040:
    why: "An executable file signature (PE/ELF/Mach-O) was found inside the model.\
      \ Embedded binaries in ML models are a clear indicator of malicious content."
    remediation: "Do not load this model under any circumstances. Isolate the file\
      \ and submit it to your security team for analysis. This is a clear supply\
      \ chain attack indicator."

  MLS050:
    why: "A potential decompression attack (zip bomb or similar) was detected. Processing\
      \ this file may exhaust system resources (RAM/disk), causing denial of service."
    remediation: "Do not decompress this file without sandbox isolation. Refuse to\
      \ use this model. Report the anomaly to the supplier."

  MLS051:
    why: "A suspicious compression ratio was detected. A high compression ratio may\
      \ hide malicious content or indicate a buffer overflow attempt during decompression."
    remediation: "Verify the file in an isolated environment. For compression ratios\
      \ > 100:1, refuse to use the model without investigation."

  MLS052:
    why: "A recursive archive structure (archive within archive) was detected. This\
      \ structure is typical of zip bombs capable of causing denial of service during\
      \ recursive decompression."
    remediation: "Do not decompress recursively without depth limits. Verify the\
      \ file in a sandbox. Legitimate models do not use deeply nested compression."

