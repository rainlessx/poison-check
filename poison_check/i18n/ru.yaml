  below_section: "Ниже порога внимания (severity_threshold: {threshold})"
  below_count: "Ниже порога внимания ({threshold}): {count}"
  justification: "Ниже порога внимания политики (severity_threshold: {threshold}):\
    \ находка показана, но не требует немедленного действия"
  gate_note: "Порог внимания влияет только на подачу отчёта; провал гейта\
    \ определяется ключом fail_on_severity"

