# Человекочитаемые описания why и remediation по кодам MLS
issues:
  MLS001:
    why: "Обнаружен глобальный импорт из blocklist. Такие классы и функции не должны\
      \ присутствовать в сериализованных ML-моделях — они могут исполнять произвольный\
      \ код при загрузке."
    remediation: "Не загружайте эту модель. Попросите автора пересохранить модель\
      \ в безопасном формате safetensors. Если источник доверенный — изучите декомпилированный\
      \ код и убедитесь, что функция безвредна."

  MLS010:
    why: "Обнаружен глобальный импорт, отсутствующий в allowlist для данного ML-фреймворка.\
      \ Это может быть как вредоносный payload, так и нестандартная зависимость."
    remediation: "Проверьте декомпилированный код. Если функция безопасна — добавьте\
      \ её в allowlist соответствующего фреймворка (rules/allowlist/). Если сомнительна\
      \ — не загружайте модель."

  MLS020:
    why: "В модели обнаружен секрет (API-ключ, токен, пароль). Вероятно, модель была\
      \ сохранена в окружении с активными учётными данными, которые случайно попали\
      \ в файл."
    remediation: "Немедленно отзовите скомпрометированный секрет в соответствующем\
      \ сервисе. Очистите модель от секретов и пересохраните. Не публикуйте скомпрометированную\
      \ модель."

  MLS030:
    why: "В модели обнаружен URL к потенциально опасному домену. Это может быть индикатором\
      \ C2-коммуникации (Command & Control) при загрузке модели."
    remediation: "Проверьте URL вручную. Если домен неизвестен — не загружайте модель.\
      \ Сообщите в службу ИБ."

  MLS031:
    why: "В модели обнаружен URL к неизвестному внешнему домену. При загрузке модели\
      \ может произойти обращение к этому URL, что нарушает требования офлайн-работы\
      \ и может являться утечкой данных."
    remediation: "Проверьте, для чего используется этот URL. Если модель должна\
      \ работать офлайн — это недопустимо. Попросите автора убрать внешние зависимости."

  MLS032:
    why: "В модели обнаружен URL к локальному или приватному IP-адресу. Это может\
      \ указывать на попытку SSRF (Server-Side Request Forgery) или атаку на внутреннюю\
      \ инфраструктуру при загрузке модели."
    remediation: "Изучите контекст использования этого адреса. Если он не нужен\
      \ для работы модели — это подозрительно. Не загружайте модель в production."

  MLS033:
    why: "В модели обнаружен URL к публичному IP-адресу. Прямые IP-адреса в моделях\
      \ — нетипичная практика и может свидетельствовать о попытке установить скрытое\
      \ соединение."
    remediation: "Проверьте, что это не C2-адрес. Воспользуйтесь репутационными\
      \ сервисами (VirusTotal, AbuseIPDB). Если адрес подозрительный — не загружайте\
      \ модель."

  MLS034:
    why: "В модели обнаружен публичный IP-адрес в строковых данных. Возможна попытка\
      \ установить скрытое сетевое соединение при выполнении кода модели."
    remediation: "Проверьте репутацию IP-адреса. Если модель не должна обращаться\
      \ к внешним адресам — это подозрительно. Свяжитесь со службой ИБ."

  MLS040:
    why: "В файле модели обнаружена сигнатура исполняемого файла (PE/ELF/Mach-O).\
      \ Внедрённые бинарники в ML-моделях — явный признак вредоносного содержимого."
    remediation: "Не загружайте эту модель ни при каких обстоятельствах. Изолируйте\
      \ файл и передайте в службу ИБ для анализа. Это явный индикатор атаки на цепочку\
      \ поставок."

  MLS050:
    why: "Обнаружена потенциальная атака распаковки (zip-бомба или аналог). При\
      \ обработке такого файла может произойти исчерпание ресурсов (RAM/диск), что\
      \ приведёт к отказу в обслуживании."
    remediation: "Не распаковывайте этот файл без sandbox-изоляции. Откажитесь\
      \ от использования модели. Сообщите поставщику об аномалии."

  MLS051:
    why: "Обнаружен подозрительный уровень компрессии. Высокий коэффициент сжатия\
      \ может скрывать вредоносное содержимое или указывать на попытку переполнения\
      \ буфера при распаковке."
    remediation: "Проверьте файл в изолированной среде. При соотношении сжатия\
      \ > 100:1 откажитесь от использования модели без расследования."

  MLS052:
    why: "Обнаружена рекурсивная структура архива (архив внутри архива). Такая структура\
      \ типична для zip-бомб, способных вызвать отказ в обслуживании при рекурсивной\
      \ распаковке."
    remediation: "Не распаковывайте рекурсивно без ограничения глубины. Проверьте\
      \ файл в sandbox. Легитимные модели обычно не используют многоуровневую вложенность."

