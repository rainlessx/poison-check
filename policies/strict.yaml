name: strict
description: "Максимально строгая политика — подходит для production CI/CD"

# Все детекторы включены
enabled_detectors:
  - blocklist
  - allowlist
  - cve
  - secrets
  - network
  - executable
  - format_policy
  - compression
  - gguf_metadata
  - numpy_metadata
  - joblib_metadata
  - keras
  - bundle_code
  - parse_error

# Порог ВНИМАНИЯ на минимуме: ни одна находка не помечается подпороговой.
severity_threshold: info

# MEDIUM и выше → exit code 1 (нулевая толерантность в production)
fail_on_severity: medium

# Compliance — все доступные стандарты
compliance:
  - fstec
  - owasp_ml
  - gost_56939_2024

# Дополнительные правила для production CI/CD.
# Все перечисленные ниже ключи ПРИМЕНЯЮТСЯ (enforced) — реестр точек применения
# см. в poison_check/policies.py (POLICY_KEYS / EXTRA_RULE_KEYS).
extra_rules:
  # [enforced] Любой внешний URL → HIGH.
  # Реализация: NetworkDetector(escalate_external_urls=True), код MLS-NET-002.
  no_external_urls: true
  # [enforced] Непроверенный файл (нет обязательной зависимости для разбора
  # формата) → HIGH вместо MEDIUM: в production CI такой файл нельзя пропускать.
  # Реализация: KerasThreatDetector(escalate_unverified=True), MLS-KERAS-003.
  no_unverified_files: true
  # [enforced] Допустимы только форматы, не исполняющие код при загрузке
  # (safetensors, GGUF, NumPy без object-dtype). pickle/joblib/PyTorch/Keras →
  # HIGH даже при чистом содержимом: в production CI недопустим сам формат.
  # Реализация: FormatPolicyDetector(require_safetensors=True), код MLS-FMT-002.
  require_safetensors: true
  # [enforced] Формат определяется по содержимому, а не по расширению;
  # расхождение → HIGH (маскировка pickle под model.safetensors).
  # Реализация: FormatPolicyDetector(strict_format_detection=True), MLS-FMT-001.
  strict_format_detection: true
  # [enforced] Максимальный допустимый размер файла модели (ГБ).
  # Применяется, если не задан CLI-флаг --max-file-size (он приоритетнее).
  max_file_size_gb: 10
