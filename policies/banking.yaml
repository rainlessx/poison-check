name: banking
description: "Политика для финансовых организаций — максимальная строгость"

# Все детекторы включены
enabled_detectors:
  - blocklist
  - allowlist
  - cve
  - secrets
  - network
  - executable
  - format_policy
  - compression
  - gguf_metadata
  - numpy_metadata
  - joblib_metadata
  - keras
  - bundle_code
  - parse_error

# Порог ВНИМАНИЯ низкий: подпороговыми помечаются только INFO-находки,
# и то не все — факты уровня файла (непроверенный файл, parse-error,
# бомба) под порог не уходят никогда.
severity_threshold: low

# Даже HIGH → exit code 1 (банки требуют нулевой толерантности к высоким рискам)
fail_on_severity: high

# Маппинг на регуляторные требования
compliance:
  - fstec
  - owasp_ml
  - gost_56939_2024

# Дополнительные правила для финансового сектора.
# Все перечисленные ниже ключи ПРИМЕНЯЮТСЯ (enforced) — реестр точек применения
# см. в poison_check/policies.py (POLICY_KEYS / EXTRA_RULE_KEYS).
extra_rules:
  # [enforced] Любой внешний URL в модели → HIGH (признак C2-коммуникации).
  # Реализация: NetworkDetector(escalate_external_urls=True), код MLS-NET-002.
  no_external_urls: true
  # [enforced] Файл, который сканер не смог проверить из-за отсутствия
  # обязательной зависимости → HIGH вместо MEDIUM (для банка «не проверено»
  # равно «не допущено»). Реализация: KerasThreatDetector(
  # escalate_unverified=True), код MLS-KERAS-003.
  no_unverified_files: true
  # [enforced] Допустимы только форматы, не исполняющие код при загрузке
  # (safetensors, GGUF, NumPy без object-dtype). pickle/joblib/PyTorch/Keras →
  # HIGH даже при чистом содержимом: в банковском контуре недопустим сам формат.
  # Реализация: FormatPolicyDetector(require_safetensors=True), код MLS-FMT-002.
  require_safetensors: true
  # [enforced] Формат определяется по содержимому, а не по расширению;
  # расхождение → HIGH (маскировка pickle под model.safetensors).
  # Реализация: FormatPolicyDetector(strict_format_detection=True), MLS-FMT-001.
  strict_format_detection: true
  # [enforced] Максимальный допустимый размер файла модели (ГБ).
  # Применяется, если не задан CLI-флаг --max-file-size (он приоритетнее).
  max_file_size_gb: 50
